<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>GLB 모델 + 이동 (PC & VR)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <!-- A-Frame 씬 시작 -->
  <a-scene>
    
    <!-- ===== 카메라 (PC: WASD + 마우스 / VR: 자동 컨트롤러) ===== -->
    <!-- 카메라를 모델 가까이 이동 -->
    <a-entity id="rig" position="0 1.6 2">
      <a-camera wasd-controls look-controls></a-camera>

      <!-- VR 컨트롤러 -->
      <a-entity laser-controls="hand: left"></a-entity>
      <a-entity laser-controls="hand: right"></a-entity>
    </a-entity>

    <!-- ===== 바닥 ===== -->
    <a-plane 
      rotation="-90 0 0" 
      width="100" 
      height="100" 
      color="#7BC8A4">
    </a-plane>

    <!-- ===== 하늘 ===== -->
    <a-sky color="#ECECEC"></a-sky>

    <!-- ===== 조명 ===== -->
    <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
    <a-light type="directional" position="5 10 7" intensity="1"></a-light>

    <!-- ===== GLB 모델 ===== -->
    <a-entity 
      gltf-model="model.glb"
      position="0 0 -1"    <!-- 카메라 바로 앞 -->
      scale="20 20 20"    <!-- 20배 확대 유지 -->
      rotation="0 30 0">
    </a-entity>

  </a-scene>
</body>
</html>
