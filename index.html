<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>GLB 모델 초대형 (20배 추가 확대)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    
    <!-- ===== 카메라 ===== -->
    <!-- 🔥 모델이 더 커졌으므로 훨씬 더 뒤로 이동 -->
    <a-entity id="rig" position="0 50 300">
      <a-camera wasd-controls look-controls></a-camera>
      <a-entity laser-controls="hand: left"></a-entity>
      <a-entity laser-controls="hand: right"></a-entity>
    </a-entity>

    <!-- ===== 바닥 ===== -->
    <a-plane 
      rotation="-90 0 0" 
      width="2000" 
      height="2000" 
      color="#7BC8A4">
    </a-plane>

    <!-- ===== 하늘 ===== -->
    <a-sky color="#ECECEC"></a-sky>

    <!-- ===== 조명 ===== -->
    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" position="200 400 200" intensity="1"></a-light>

    <!-- ===== GLB 모델 ===== -->
    <!-- 🔥 기존 20배에서 또 20배 → 총 400배 -->
    <a-entity 
      gltf-model="model.glb"
      position="0 0 -200" 
      scale="400 400 400"  <!-- 🔥 20배 × 20배 = 400배 -->
      rotation="0 30 0">
    </a-entity>

  </a-scene>
</body>
</html>
