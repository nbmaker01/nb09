<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>GLB 모델 초초대형</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    
    <!-- ===== 카메라 ===== -->
    <!-- 🔥 모델만 커졌으므로 카메라도 충분히 뒤로 -->
    <a-entity id="rig" position="0 200 1200">
      <a-camera wasd-controls look-controls></a-camera>
      <a-entity laser-controls="hand: left"></a-entity>
      <a-entity laser-controls="hand: right"></a-entity>
    </a-entity>

    <!-- ===== 바닥 (변경 없음) ===== -->
    <a-plane 
      rotation="-90 0 0" 
      width="2000" 
      height="2000" 
      color="#7BC8A4">
    </a-plane>

    <!-- ===== 하늘 (변경 없음) ===== -->
    <a-sky color="#ECECEC"></a-sky>

    <!-- ===== 조명 ===== -->
    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" position="200 400 200" intensity="1"></a-light>

    <!-- ===== GLB 모델 ===== -->
    <!-- 🔥 기존 400배에서 100배 추가 → 총 40,000배 -->
    <a-entity 
      gltf-model="model.glb"
      position="0 0 -800" 
      scale="40000 40000 40000"  <!-- 🔥 모델만 초대형 -->
      rotation="0 30 0">
    </a-entity>

  </a-scene>
</body>
</html>
